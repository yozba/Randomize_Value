schema_version = "1.0.0"

id = "randomize_value"
version = "1.0.0"
name = "Randomize Value"
tagline = "Randomize a clicked property across selected Blender items"
maintainer = "yozba"
type = "add-on"

blender_version_min = "4.2.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

[permissions]
clipboard = "Detect the vector component selected in the property menu"

[build]
paths = [
  "__init__.py",
  "randomize_core.py",
  "LICENSE",
  "README.md",
]
